name: Docs-vnext Bounded Baseline Sync

on:
  workflow_run:
    workflows: ["Docs-vnext Baseline Sync Manifest"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      manifest_run_id:
        description: Retained successful manifest workflow run ID (defaults to latest)
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: docs-vnext-bounded-baseline-sync
  cancel-in-progress: false

jobs:
  apply-batches:
    name: Apply bounded batches
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Initialize failure checkpoint
        env:
          CHECKPOINT_PATH: ${{ runner.temp }}/docs-vnext-sync/checkpoint.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$CHECKPOINT_PATH")"
          python3 - "$CHECKPOINT_PATH" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          checkpoint = {
              "schemaVersion": 1,
              "status": "failed",
              "manifest": {"sha256": None, "runId": None},
              "limits": {"maxFiles": 50, "maxPayloadBytes": 41943040},
              "summary": {"completed": 0, "failed": 0, "pending": 0},
              "diagnostics": ["Workflow failed before the batch runner initialized."],
              "batches": [],
          }
          path.write_text(json.dumps(checkpoint, indent=2, sort_keys=True) + "\n")
          PY

      - name: Create repository automation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.FOUNDRY_DEVX_APP_CLIENT_ID }}
          private-key: ${{ secrets.FOUNDRY_DEVX_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: foundry-docs

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Preflight GitHub App automation token
        env:
          CHECKPOINT_PATH: ${{ runner.temp }}/docs-vnext-sync/checkpoint.json
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          SYNC_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          umask 077
          fail_preflight() {
            local message="$1"
            python3 - "$CHECKPOINT_PATH" "$message" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          checkpoint = json.loads(path.read_text())
          checkpoint["diagnostics"] = [sys.argv[2]]
          path.write_text(json.dumps(checkpoint, indent=2, sort_keys=True) + "\n")
          PY
            echo "::error::$message"
            exit 1
          }
          if [[ -z "$SYNC_TOKEN" ]]; then
            fail_preflight "The foundry-devx-agent installation token is absent."
          fi
          if ! push_permission=$(GH_TOKEN="$SYNC_TOKEN" gh api "repos/$REPOSITORY" \
            --jq '.permissions.push' 2>/dev/null); then
            fail_preflight "The foundry-devx-agent token cannot read permission metadata for $REPOSITORY."
          fi
          if [[ "$push_permission" != "true" ]]; then
            fail_preflight "The foundry-devx-agent token does not grant push access to $REPOSITORY."
          fi
          if ! GH_TOKEN="$SYNC_TOKEN" gh api --method GET \
            "repos/$REPOSITORY/pulls?state=open&per_page=1" >/dev/null; then
            fail_preflight "The foundry-devx-agent token cannot access pull requests in $REPOSITORY."
          fi
          GH_TOKEN="$SYNC_TOKEN" gh auth setup-git
          if ! GH_TOKEN="$SYNC_TOKEN" git ls-remote --exit-code origin \
            "refs/heads/$DEFAULT_BRANCH" >/dev/null; then
            fail_preflight "The foundry-devx-agent token is not usable for Git access to $REPOSITORY."
          fi
          preflight_ref="refs/heads/automation/docs-vnext-sync/preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if ! GH_TOKEN="$SYNC_TOKEN" git push --dry-run origin \
            "HEAD:$preflight_ref" >/dev/null 2>&1; then
            fail_preflight "The foundry-devx-agent token cannot push branches to $REPOSITORY."
          fi
          pr_probe="$RUNNER_TEMP/docs-vnext-sync/pr-write-probe.json"
          pr_response="$RUNNER_TEMP/docs-vnext-sync/pr-write-response.txt"
          python3 - "$pr_probe" "$GITHUB_REPOSITORY_OWNER" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          suffix = f"{sys.argv[3]}-{sys.argv[4]}"
          probe = {
              "title": f"docs-vnext sync permission probe {suffix}",
              "head": f"{sys.argv[2]}:automation/docs-vnext-sync/nonexistent-{suffix}",
              "base": f"docs-vnext-sync-nonexistent-base-{suffix}",
              "body": "This request must fail validation and must not create a pull request.",
          }
          path.write_text(json.dumps(probe))
          PY
          set +e
          GH_TOKEN="$SYNC_TOKEN" gh api --method POST "repos/$REPOSITORY/pulls" \
            --input "$pr_probe" --include >"$pr_response" 2>/dev/null
          pr_probe_exit=$?
          set -e
          pr_probe_status=$(awk '
            toupper($1) ~ /^HTTP\// { status=$2 }
            END { print status }
          ' "$pr_response")
          rm -f "$pr_probe" "$pr_response"
          if [[ "$pr_probe_exit" -eq 0 || "$pr_probe_status" != "422" ]]; then
            fail_preflight "The foundry-devx-agent pull-request write probe failed with HTTP ${pr_probe_status:-unknown}."
          fi

      - name: Resolve retained manifest run
        id: manifest
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RUN_ID: ${{ inputs.manifest_run_id }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$INPUT_RUN_ID"
          if [[ -z "$run_id" && "$EVENT_NAME" == "workflow_run" ]]; then
            run_id="$WORKFLOW_RUN_ID"
          fi
          if [[ -z "$run_id" ]]; then
            run_id=$(gh run list \
              --workflow docs-vnext-sync-manifest.yml \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')
          fi
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::A successful numeric manifest workflow run ID is required."
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download retained schema-v2 manifest
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_RUN_ID: ${{ steps.manifest.outputs.run-id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/docs-vnext-sync"
          gh run download "$MANIFEST_RUN_ID" \
            --name "docs-vnext-sync-manifest-$MANIFEST_RUN_ID" \
            --dir "$RUNNER_TEMP/docs-vnext-sync"
          test -f "$RUNNER_TEMP/docs-vnext-sync/docs-vnext-sync-manifest.json"

      - name: Apply resumable bounded batches
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MANIFEST_RUN_ID: ${{ steps.manifest.outputs.run-id }}
        run: |
          set -euo pipefail
          python3 scripts/apply_docs_vnext_sync_batches.py \
            --manifest "$RUNNER_TEMP/docs-vnext-sync/docs-vnext-sync-manifest.json" \
            --manifest-run-id "$MANIFEST_RUN_ID" \
            --repository "${{ github.repository }}" \
            --repository-root "$GITHUB_WORKSPACE" \
            --runner-temp "$RUNNER_TEMP/docs-vnext-sync" \
            --checkpoint "$RUNNER_TEMP/docs-vnext-sync/checkpoint.json" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --max-files 50 \
            --max-payload-bytes 41943040

      - name: Retain batch checkpoint
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-vnext-sync-checkpoint-${{ github.run_id }}
          path: ${{ runner.temp }}/docs-vnext-sync/checkpoint.json
          if-no-files-found: error
          retention-days: 30
