name: Documentation Evaluation Harness

on:
  pull_request:
    paths:
      - 'docs-vnext/**'
  workflow_run:
    workflows: ["Post-Merge Documentation Verification"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 6 * * 0"  # Weekly Sunday 06:00 UTC
  workflow_dispatch:
    inputs:
      servers:
        description: "Servers to evaluate (comma-separated, or 'all')"
        required: false
        default: "all"
        type: string
      models:
        description: "Models to use (comma-separated, or 'all')"
        required: false
        default: "all"
        type: string

concurrency:
  group: docs-eval
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
  # Required so foundry-docs / foundry-docs-vnext MCP servers exercise the Azure AI Search
  # hybrid backend instead of silently falling back to local TF-IDF (see _server_factory.py).
  AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}
  AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}
  AZURE_SEARCH_INDEX_NAME: ${{ secrets.AZURE_SEARCH_INDEX_NAME }}
  AZURE_SEARCH_VNEXT_INDEX_NAME: ${{ secrets.AZURE_SEARCH_VNEXT_INDEX_NAME }}
  AZURE_AI_PROJECT_ENDPOINT: ${{ secrets.AZURE_AI_PROJECT_ENDPOINT }}
  AZURE_AI_PROJECT_API_KEY: ${{ secrets.AZURE_AI_PROJECT_API_KEY }}
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}

jobs:
  evaluate:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        server:
          - microsoft-learn
          - mintlify-hosted
          - foundry-docs
          - foundry-docs-vnext
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      - name: Setup gh-aw actions
        uses: github/gh-aw-actions/setup@6aab9e5b5c91c615506061f09bedd81a23babe3c # v0.86.2
        with:
          destination: /opt/gh-aw/actions

      - name: Install Copilot CLI
        run: /opt/gh-aw/actions/install_copilot_cli.sh 1.0.65
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      - name: Parse model inputs
        id: inputs
        run: |
          MODELS="${{ inputs.models || 'all' }}"
          if [ "$MODELS" = "all" ]; then
            echo "model_args=" >> "$GITHUB_OUTPUT"
          else
            echo "model_args=--models $(echo $MODELS | tr ',' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Run evaluation for ${{ matrix.server }}
        run: |
          AZURE_ARGS=()
          if [[ "${{ matrix.server }}" == foundry-docs* ]]; then
            AZURE_ARGS+=(--require-azure)
          fi
          python scripts/run_docs_eval.py \
            --server ${{ matrix.server }} \
            ${{ steps.inputs.outputs.model_args }} \
            "${AZURE_ARGS[@]}" \
            --output-dir tests/eval_results

      - name: Upload partial results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        if: always()
        with:
          name: eval-partial-${{ matrix.server }}
          path: tests/eval_results/
          retention-days: 7

  merge-and-report:
    needs: [evaluate]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      - name: Download all partial results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: eval-partial-*
          path: tests/eval_results/partials
          merge-multiple: false

      - name: Collect result files
        id: collect
        run: |
          echo "=== Downloaded artifacts ==="
          find tests/eval_results/partials -name "run-*.json" -type f | sort
          FILES=$(find tests/eval_results/partials -name "run-*.json" -type f | sort | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Found $(echo $FILES | wc -w) result files"

      - name: Score merged results
        id: score
        continue-on-error: true
        run: |
          mkdir -p tests/eval_results
          MODELS="${{ inputs.models || 'all' }}"
          if [ "$MODELS" = "all" ]; then
            REQUIRED_MODELS=(claude-sonnet-4.6 gpt-5.4)
          else
            IFS=',' read -ra REQUIRED_MODELS <<< "$MODELS"
          fi
          python scripts/eval_scorer.py \
            ${{ steps.collect.outputs.files }} \
            --output tests/eval_results/scored-merged.json \
            --required-scenarios tests/docs_eval_scenarios.json \
            --required-servers microsoft-learn mintlify-hosted foundry-docs foundry-docs-vnext \
            --required-models "${REQUIRED_MODELS[@]}" \
            --azure-required-servers foundry-docs foundry-docs-vnext

      - name: Check MCP/tool discovery state
        run: |
          python scripts/check_mcp_discovery.py \
            --output tests/eval_results/mcp_discovery.json \
            --skip-hosted || true

      - name: Generate report
        if: always()
        run: |
          python scripts/eval_report.py tests/eval_results/scored-merged.json \
            --mcp-discovery tests/eval_results/mcp_discovery.json \
            --output tests/eval_results/report.md
          cat tests/eval_results/report.md

      - name: Upload combined results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: eval-results-${{ github.run_id }}
          path: tests/eval_results/
          retention-days: 90

      - name: Close previous eval report issues
        if: steps.score.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generated_report_cleanup.py cleanup \
            --repo "${{ github.repository }}" \
            --label "eval-report" \
            --workflow-identity "docs-eval-harness" \
            --report-kind "docs-evaluation" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Create issue with results
        if: steps.score.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT_DATE="$(date -u +%Y-%m-%d)"
          MARKER="$(python scripts/generated_report_cleanup.py marker \
            --workflow-identity "docs-eval-harness" \
            --report-kind "docs-evaluation" \
            --report-date "$REPORT_DATE")"
          {
            printf '%s\n\n' "$MARKER"
            cat tests/eval_results/report.md
          } > tests/eval_results/issue-report.md
          TITLE="📊 Docs Eval Report - $REPORT_DATE"
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --body-file tests/eval_results/issue-report.md \
            --label "eval-report" --label "automation" || \
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --body-file tests/eval_results/issue-report.md

      - name: Check for regression
        if: steps.score.outcome == 'success'
        run: |
          python3 -c "
          import json, sys
          with open('tests/eval_results/scored-merged.json') as f:
              data = json.load(f)
          avgs = data.get('aggregates', {}).get('server_averages', {})
          regressions = {s: v for s, v in avgs.items() if v < 0.3}
          if regressions:
              print('⚠️ Regression detected:', regressions)
              sys.exit(1)
          print('✅ No regressions detected')
          " || echo "regression_detected=true" >> "$GITHUB_OUTPUT"

      - name: Fail invalid evaluation evidence
        if: steps.score.outcome != 'success'
        run: |
          echo "Comparative publication blocked because required evaluation evidence is invalid or incomplete."
          exit 1
